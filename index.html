<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>星座カード</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/special-viewer.css">

</head>

<body>

  <!-- カード表示エリア -->
<div id="card-area">
  <div class="card-frame" id="card-front">
    <img src="image/cards/spring_triangle.jpg" class="card-img">
  </div>
</div>

  <!-- 操作ボタン -->
  <div id="controls">
    <button id="prevBtn">前のカード</button>
    <button id="flipBtn">表／裏めくる</button>
    <button id="nextBtn">次のカード</button>
  </div>

  <!-- 季節ボタン -->
  <div id="season-buttons">
    <button id="springBtn">春</button>
    <button id="summerBtn">夏</button>
    <button id="autumnBtn">秋</button>
    <button id="winterBtn">冬</button>
    <button id="southBtn">南</button>

    <!-- ★ボタン -->
    <button id="specialBtn" disabled style="opacity:0.4;">★</button>
  </div>

<!-- ★ Special写真 viewer（必須） -->
<div id="special-viewer" style="display:none;">
  <img id="special-img" src="">

  <div id="special-buttons">
    <button id="special-close">戻る</button>
    <button id="special-lines">星座線を描く</button>
    <button id="special-clear">消す</button>
  </div>
</div>


  <!-- 外部 JavaScript -->
  <script src="js/main.js"></script>

</body>

</html>
