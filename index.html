<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>星座カード</title>

  <style>
    /* Special写真 viewer（画面全体に表示） */
    #special-viewer {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.85);
      z-index: 9999;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #special-img {
      max-width: 95vw;
      max-height: 85vh;
      object-fit: contain;
    }

    #special-close {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <h1>【開発中】星座カード</h1>

  <!-- カード表示エリア -->
  <div id="card-area">
    <img src="image/other/card-top.png" alt="星座カード">
  </div>

  <!-- 操作ボタン -->
  <div id="controls">
    <button id="prevBtn">前のカード</button>
    <button id="flipBtn">表／裏めくる</button>
    <button id="nextBtn">次のカード</button>
  </div>

  <!-- 季節ボタン -->
  <div id="season-buttons">
    <button id="springBtn">春</button>
    <button id="summerBtn">夏</button>
    <button id="autumnBtn">秋</button>
    <button id="winterBtn">冬</button>
    <button id="southBtn">南</button>

    <!-- ★ボタン -->
    <button id="specialBtn" disabled style="opacity:0.4;">★</button>
  </div>

<!-- ★ Special写真 viewer（必須） -->
<div id="special-viewer" style="display:none;">
  <img id="special-img" src="">

  <div id="special-buttons">
    <button id="special-close">戻る</button>
    <button id="special-lines">星座線を描く</button>
    <button id="special-clear">消す</button>
  </div>
</div>


  <!-- 外部 JavaScript -->
  <script src="js/main.js"></script>

</body>

</html>
