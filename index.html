<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">
  <title>四季の星座 暗記カード：制作中</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <h1>四季の星座 暗記カード：制作中</h1>

  <div id="book">

    <!-- 表紙-->
    <div class="card active">
      <div class="page-wrapper">
        <div class="flip-inner">
          <div class="face front"><img src="image/page-top.png"></div>
          <div class="face back"><img src="image/page-null.png"></div>
        </div>
      </div>
    </div>

    <!-- 凡例 -->
    <div class="card">
      <div class="page-wrapper">
        <div class="flip-inner">
          <div class="face front"><img src="image/page-explanatory-note.png"></div>
          <div class="face back"><img src="image/page-null.png"></div>
        </div>
      </div>
    </div>

    <!-- 春の星座 -->
    <div class="card" data-season="spring" data-name="Ursa-Minor">
      <div class="page-wrapper">
        <div class="flip-inner">
          <div class="face front"><img src="image/spring/page-Ursa-Minor-Q.png"></div>
          <div class="face back"><img src="image/spring/page-Ursa-Minor-A.png"></div>
        </div>
      </div>
    </div>

    <div class="card" data-season="spring" data-name="Crater">
      <div class="page-wrapper">
        <div class="flip-inner">
          <div class="face front"><img src="image/spring/page-Crater-Q.png"></div>
          <div class="face back"><img src="image/spring/page-Crater-A.png"></div>
        </div>
      </div>
    </div>

    <div class="card" data-season="spring" data-name="Corvus">
      <div class="page-wrapper">
        <div class="flip-inner">
          <div class="face front"><img src="image/spring/page-Corvus-Q.png"></div>
          <div class="face back"><img src="image/spring/page-Corvus-A.png"></div>
        </div>
      </div>
    </div>

    <div class="card" data-season="spring" data-name="Hydra">
      <div class="page-wrapper">
        <div class="flip-inner">
          <div class="face front"><img src="image/spring/page-Hydra-Q.png"></div>
          <div class="face back"><img src="image/spring/page-Hydra-A.png"></div>
        </div>
      </div>
    </div>

    <div class="card" data-season="spring" data-name="Cancer">
      <div class="page-wrapper">
        <div class="flip-inner">
          <div class="face front"><img src="image/spring/page-Cancer-Q.png"></div>
          <div class="face back"><img src="image/spring/page-Cancer-A.png"></div>
        </div>
      </div>
    </div>

    <div class="card" data-season="spring" data-name="Ursa-Major">
      <div class="page-wrapper">
        <div class="flip-inner">
          <div class="face front"><img src="image/spring/page-Ursa-Major-Q.png"></div>
          <div class="face back"><img src="image/spring/page-Ursa-Major-A.png"></div>
        </div>
      </div>
    </div>

    <div class="card" data-season="spring" data-name="Bootes">
      <div class="page-wrapper">
        <div class="flip-inner">
          <div class="face front"><img src="image/spring/page-Bootes-Q.png"></div>
          <div class="face back"><img src="image/spring/page-Bootes-A.png"></div>
        </div>
      </div>
    </div>

    <div class="card" data-season="spring" data-name="Virgo">
      <div class="page-wrapper">
        <div class="flip-inner">
          <div class="face front"><img src="image/spring/page-Virgo-Q.png"></div>
          <div class="face back"><img src="image/spring/page-Virgo-A.png"></div>
        </div>
      </div>
    </div>

    <div class="card" data-season="spring" data-name="Leo">
      <div class="page-wrapper">
        <div class="flip-inner">
          <div class="face front"><img src="image/spring/page-Leo-Q.png"></div>
          <div class="face back"><img src="image/spring/page-Leo-A.png"></div>
        </div>
      </div>
    </div>

    <div class="card" data-season="spring" data-name="The-Big-Curve-of-Spring">
      <div class="page-wrapper">
        <div class="flip-inner">
          <div class="face front"><img src="image/spring/page-The-Big-Curve-of-Spring.png"></div>
          <div class="face back"><img src="image/page-null.png"></div>
        </div>
      </div>
    </div>

    <div class="card" data-season="spring" data-name="Spring-Triangle">
      <div class="page-wrapper">
        <div class="flip-inner">
          <div class="face front"><img src="image/spring/page-Spring-Triangle.png"></div>
          <div class="face back"><img src="image/page-null.png"></div>
        </div>
      </div>
    </div>

  </div>

  <div class="page-indicator" id="pageIndicator">
    カード 1 / ５ ｜ 表面
  </div>

  <div class="controls">
    <button id="prevBtn">前のカード</button>
    <button id="nextBtn">次のカード</button>
    <button id="flipBtn">表／裏をめくる</button>
  </div>

<script src="js/main.js"></script>

</body>
</html>
