<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>トレミーの48星座カード</title>

  <link rel="icon" href="image/icon/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="image/icon/icon-512.png">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/buttons.css">
  <link rel="stylesheet" href="css/special-viewer.css">
  <link rel="stylesheet" href="css/animation.css">
  <link rel="stylesheet" href="css/effects.css">
  <link rel="stylesheet" href="css/ui.css">
</head>

<body>

  <div id="rotate-warning">このアプリは縦画面でご利用ください</div>

  <div id="sound-global-buttons">
    <img src="image/common/btn-audio-on.png" id="soundOnBtn">
    <img src="image/common/btn-audio-off.png" id="soundOffBtn" style="display:none;">
  </div>

  <div id="stars-overlay"></div>

  <!-- 月の背景アニメーション -->
  <img id="moon" src="image/common/moon5-crescent.png" alt="月">
  <div id="moonAnime" onclick="openMoonSpecialViewer()"></div>

  <!-- 星座カード -->
  <div id="card-frame" class="card-frame">

    <div class="card-image-area">
      <div id="card-anim-wrapper">
        <img src="image/other/card-top.png" id="card-img" class="card-img">
      </div>
    </div>

    <div class="button-block">

      <div class="season-group">
        <img src="image/common/btn-spring.png" class="btn-season" id="springBtn" data-season="spring">
        <img src="image/common/btn-summer.png" class="btn-season" id="summerBtn" data-season="summer">
        <img src="image/common/btn-autumn.png" class="btn-season" id="autumnBtn" data-season="autumn">
        <img src="image/common/btn-winter.png" class="btn-season" id="winterBtn" data-season="winter">
        <img src="image/common/btn-south.png" class="btn-season" id="southBtn" data-season="south">
      </div>

      <div class="control-group">
        <img src="image/common/btn-back.png" class="btn-control" id="prevBtn">
        <img src="image/common/btn-flip.png" class="btn-control" id="flipBtn">
        <img src="image/common/btn-next.png" class="btn-control" id="nextBtn">
      </div>

      <div class="special-group">
        <img src="image/common/btn-3stars.png" class="btn-special" id="specialBtn">
      </div>

    </div>
  </div>

  <div id="copyright">©トレミーの48星座カード All rights reserved. 2026</div>

  <div id="specialThanksBtn" class="special-thanks-btn">
    Special Thanks:『ぴーとの星図』
  </div>

  <!-- ★★★★★ 星座専用 Special Viewer（既存） ★★★★★ -->
  <div id="special-viewer" style="display:none;">
    <img id="special-img" src="">
    <div id="special-caption"></div>

    <div class="special-controls-row">
      <img src="image/common/btn-back.png" id="special-prev" class="special-btn">
      <img src="image/common/btn-3stars.png" id="special-lines" class="special-btn">
      <img src="image/common/btn-close.png" id="special-close" class="special-btn">
      <img src="image/common/btn-3stars-lines.png" id="special-clear" class="special-btn">
      <img src="image/common/btn-next.png" id="special-next" class="special-btn">
    </div>

    <audio id="soundFlip" src="sound/sound-flipping-paper.mp3"></audio>
    <audio id="soundPage" src="sound/sound-flipping-paper2.mp3"></audio>
    <audio id="soundSeason" src="sound/sound-season.mp3"></audio>
    <audio id="soundKirakira" src="sound/sound-kirakira.mp3"></audio>
  </div>

  <!-- ★★★★★ 月専用 Special Viewer ★★★★★ -->
  <div id="moon-special-viewer" style="display:none;">
    <img id="moon-special-img" src="">
    <div id="moon-special-caption"></div>

    <div class="special-controls-row">
      <img src="image/common/btn-back.png" id="moon-special-prev" class="special-btn">
      <img src="image/common/btn-close.png" id="moon-special-close" class="special-btn">
      <img src="image/common/btn-next.png" id="moon-special-next" class="special-btn">
    </div>
  </div>

  <!-- JS -->
  <script src="js/images.js"></script>
  <script src="js/sound-controls.js"></script>
  <script src="js/animation-controls.js"></script>
  <script src="js/data-links.js"></script>
  <script src="js/data-season.js"></script>
  <script src="js/update-season-buttons.js"></script>
  <script src="js/viewer.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/background-image.js"></script>
  <script src="js/moon-animation.js"></script>
  <script src="js/data-special.js"></script>
  <script src="js/special-viewer.js"></script>
  <script src="js/external-links.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
