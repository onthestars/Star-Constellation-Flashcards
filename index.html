<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>星座カード</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- ★ カード枠（スマホ画面の黒枠） -->
  <div id="card-frame">

    <!-- ★ カード画像（最初は表紙。JSが差し替える） -->
    <div class="card-image-area">
      <img src="image/other/card-top.png" id="card-img" class="card-img">
    </div>

    <!-- ★ 四季ボタンブロック -->
    <div class="season-block">
      <div class="button-row season-row">
        <img src="image/common/btn-spring.png" class="btn-season" id="springBtn">
        <img src="image/common/btn-summer.png" class="btn-season" id="summerBtn">
        <img src="image/common/btn-autumn.png" class="btn-season" id="autumnBtn">
        <img src="image/common/btn-winter.png" class="btn-season" id="winterBtn">
        <img src="image/common/btn-south.png" class="btn-season" id="southBtn">
      </div>
    </div>

    <!-- ★ 操作ボタンブロック -->
    <div class="control-block">
      <div class="button-row control-row">
        <img src="image/common/btn-back.png" class="btn-control" id="prevBtn">
        <img src="image/common/btn-flip.png" class="btn-control" id="flipBtn">
        <img src="image/common/btn-next.png" class="btn-control" id="nextBtn">
      </div>
    </div>

    <!-- ★ Special viewer ボタンブロック -->
    <div class="special-block">
      <div class="button-row special-row">
        <img src="image/common/btn-star.png" class="btn-special" id="specialBtn">
      </div>
    </div>

  </div>

  <script src="js/main.js"></script>
</body>

</html>
