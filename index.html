<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>星座カード</title>
</head>

<body>

  <h1>【開発中】星座カード</h1>

  <!-- カード表示エリア -->
  <div id="card-area">
    <img src="image/other/card-top.png" alt="星座カード">
  </div>

  <!-- 操作ボタン -->
  <div id="controls">
    <button id="prevBtn">前のカード</button>
    <button id="flipBtn">表／裏めくる</button>
    <button id="nextBtn">次のカード</button>
  </div>

  <!-- 季節ボタン -->
  <div id="season-controls">
    <button id="springBtn">春</button>
    <button id="summerBtn">夏</button>
    <button id="autumnBtn">秋</button>
    <button id="winterBtn">冬</button>
    <button id="southBtn">南</button>
  </div>

  <!-- 外部 JavaScript -->
  <script src="js/main.js"></script>

</body>

</html>
