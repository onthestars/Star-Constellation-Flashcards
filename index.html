<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>星座帳：からす座カード（5枚）</title>
  <style>
    body {
      font-family: system-ui;
      background: #f4f4f4;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    #book {
      width: 36vw;
      margin-top: 20px;
      perspective: 1200px;
    }

    .card {
      width: 100%;
      height: 300px; /* ★ 高さ固定（アニメ維持のため必須） */
      position: relative;
      margin-bottom: 20px;
    }

    .flip-inner {
      width: 100%;
      height: 100%;
      position: absolute;
      transform-style: preserve-3d;
      transition: transform 0.8s ease;
    }

    .flip-inner.flipped {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 10px;
    }

    .front img {
      max-width: 100%;
      max-height: 100%; /* ★ 枠内で最大化 */
      height: auto;
    }

    .back {
      transform: rotateY(180deg);
      font-size: 1.4rem;
      font-weight: 600;
    }

    .page-indicator {
      margin-top: 12px;
    }

    .controls {
      margin-top: 16px;
      display: flex;
      gap: 10px;
    }

    button {
      padding: 6px 14px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <h1>星座帳：からす座カード（5枚）</h1>

  <div id="book">

    <!-- 1枚目 -->
    <div class="card active" data-index="0">
      <div class="flip-inner">
        <div class="face front">
          <img src="karasu.png">
        </div>
        <div class="face back">
          からす
        </div>
      </div>
    </div>

    <!-- 2〜5枚目 -->
    <div class="card" data-index="1">
      <div class="flip-inner">
        <div class="face front"><img src="karasu.png"></div>
        <div class="face back">からす</div>
      </div>
    </div>

    <div class="card" data-index="2">
      <div class="flip-inner">
        <div class="face front"><img src="karasu.png"></div>
        <div class="face back">からす</div>
      </div>
    </div>

    <div class="card" data-index="3">
      <div class="flip-inner">
        <div class="face front"><img src="karasu.png"></div>
        <div class="face back">からす</div>
      </div>
    </div>

    <div class="card" data-index="4">
      <div class="flip-inner">
        <div class="face front"><img src="karasu.png"></div>
        <div class="face back">からす</div>
      </div>
    </div>

  </div>

  <div class="page-indicator" id="pageIndicator">
    カード 1 / 5 ｜ 表面
  </div>

  <div class="controls">
    <button id="prevBtn">前のカード</button>
    <button id="nextBtn">次のカード</button>
    <button id="flipBtn">表／裏をめくる</button>
  </div>

  <script>
    const cards = document.querySelectorAll('.card');
    const pageIndicator = document.getElementById('pageIndicator');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const flipBtn = document.getElementById('flipBtn');

    let currentIndex = 0;
    let isBack = false;

    function updateView() {
      cards.forEach(card => card.style.display = "none");
      const card = cards[currentIndex];
      card.style.display = "block";

      const flipInner = card.querySelector('.flip-inner');
      flipInner.classList.toggle('flipped', isBack);

      pageIndicator.textContent =
        `カード ${currentIndex + 1} / ${cards.length} ｜ ` +
        (isBack ? '裏面' : '表面');

      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === cards.length - 1;
    }

    prevBtn.addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex--;
        isBack = false;
        updateView();
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentIndex < cards.length - 1) {
        currentIndex++;
        isBack = false;
        updateView();
      }
    });

    flipBtn.addEventListener('click', () => {
      isBack = !isBack;
      updateView();
    });

    updateView();
  </script>

</body>
</html>
