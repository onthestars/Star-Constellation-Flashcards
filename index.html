<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>【開発中】 トレミーの48星座 フラッシュカード</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <div class="comment">【開発中】</div>
  <div id="contents">
    <div id="book">

      <!-- 表紙-->
      <div class="card active">
        <div class="page-wrapper">
          <div class="flip-inner">
            <div class="face front"><img src="image/card-top.png"></div>
            <div class="face back"><img src="image/card-null.png"></div>
          </div>
        </div>
      </div>

      <!-- 凡例 -->
      <div class="card">
        <div class="page-wrapper">
          <div class="flip-inner">
            <div class="face front"><img src="image/card-explanatory-note.png"></div>
            <div class="face back"><img src="image/card-null.png"></div>
          </div>
        </div>
      </div>

      <!-- 春の星座 -->
      <div class="card" data-season="spring" data-name="Ursa-Minor">
        <div class="page-wrapper">
          <div class="flip-inner">
            <div class="face front"><img src="image/spring/card-Ursa-Minor-Q.png"></div>
            <div class="face back"><img src="image/spring/card-Ursa-Minor-A.png"></div>
          </div>
        </div>
      </div>

      <div class="card" data-season="spring" data-name="Crater">
        <div class="page-wrapper">
          <div class="flip-inner">
            <div class="face front"><img src="image/spring/card-Crater-Q.png"></div>
            <div class="face back"><img src="image/spring/card-Crater-A.png"></div>
          </div>
        </div>
      </div>

    </div>

    <!-- <div id="pageIndicator">
      カード 1 / 55 ｜ 表面
    </div> -->

    <!-- ボタン -->
    <div class="container">
      <div class="season-buttons">
        <button id="springBtn">春</button>
        <button id="summerBtn">夏</button>
        <button id="autumnBtn">秋</button>
        <button id="winterBtn">冬</button>
        <button id="southBtn">南</button>
      </div>

      <div class="action-buttons">
        <button id="prevBtn">前のカード</button>
        <button id="nextBtn">次のカード</button>
        <button id="flipBtn">表／裏めくる</button>
      </div>
    </div>
    
  </div>

  <!-- JavaScript（カードのDOM表示、アニメなど） -->
  <script src="js/main.js"></script>

</body>

</html>
