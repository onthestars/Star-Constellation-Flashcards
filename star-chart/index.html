<!-- star-chart/index.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080D1A">
  <title>星図カード(開発中)</title>

  <link rel="stylesheet" href="css/star-chart.css">
  <script src="js/star-chart.js" defer></script>
</head>
<body>
  <main id="star-chart-app">

    <header id="chart-header">
      <h1>星図カード(開発中)</h1>
    </header>

<section id="chart-container" aria-label="星図">
  <canvas id="star-chart-canvas">
    お使いのブラウザはCanvasに対応していません。
  </canvas>

<!-- 独立星図専用の流星描画Canvas -->
<canvas id="star-chart-meteor-layer" aria-hidden="true"></canvas>

</section>

    <footer id="chart-footer">
      <p id="chart-status">星図を準備しています。</p>
    </footer>

  </main>
</body>
</html>
