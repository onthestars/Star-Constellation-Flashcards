<!-- star-chart/index.html -->
<!DOCTYPE html>
<html lang="ja">
<!-- star-chart/index.html -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080D1A">
  <title>流星群観測ガイド</title>

  <!-- 星図のデザイン -->
  <link rel="stylesheet" href="css/star-chart.css">

  <!-- 星の色・発光設定 -->
  <script src="js/star-style.js" defer></script>

  <!-- 星図の描画処理 -->
  <script src="js/star-chart.js" defer></script>

    <!-- ワープ演出専用処理 -->
  <script src="js/star-warp.js" defer></script>

</head>
<body>
  <main id="star-chart-app">

<section id="chart-container" class="is-warping" aria-label="星図">
  
  <canvas id="star-chart-canvas">
    お使いのブラウザはCanvasに対応していません。
  </canvas>

<!-- 独立星図専用の流星描画Canvas -->
<canvas id="star-chart-meteor-layer" aria-hidden="true"></canvas>

<!-- ワープ演出専用Canvas -->
<canvas id="star-chart-warp-layer" aria-hidden="true"></canvas>

<!-- 星図の読み込み状態 -->
<div id="chart-status" aria-live="polite"></div>
</section>

</section>

<!-- スマホ方位センサー試験 -->
<div id="sensor-test-panel">
  <button id="sensor-start" type="button">センサー開始</button>
  <button id="sensor-stop" type="button" disabled>センサー停止</button>
  <div id="sensor-status">センサー未開始</div>
</div>

</main>

  </main>
</body>
</html>
