<!-- star-chart/index.html -->
<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080D1A">
  <title>流星群観測ガイド</title>

  <!-- 星図のデザイン -->
  <link rel="stylesheet" href="css/star-chart.css">

  <!-- 星の色・発光設定 -->
  <script src="js/star-style.js" defer></script>

  <!-- 星図の描画処理 -->
  <script src="js/star-chart.js" defer></script>

  <!-- ワープ演出専用処理 -->
  <script src="js/star-warp.js" defer></script>

</head>

<body>
  <main id="star-chart-app">

    <section id="chart-container" class="is-warping" aria-label="星図">

      <canvas id="star-chart-canvas">
        お使いのブラウザはCanvasに対応していません。
      </canvas>

      <!-- プラネタリウム専用の流星描画Canvas -->
      <canvas id="star-chart-meteor-layer" aria-hidden="true"></canvas>

      <!-- ワープ演出専用Canvas -->
      <canvas id="star-chart-warp-layer" aria-hidden="true"></canvas>

      <!-- 星図の読み込み状態 -->
      <div id="chart-status" aria-live="polite"></div>

      <!-- 共有完了メッセージ -->
      <div id="chart-share-notice" hidden aria-live="polite">
        <span id="chart-share-notice-text">
          プラネタリウム（URL）を
          コピーしました。

          LINEなどに貼り付けて
          共有できます。
        </span>
        <button
          type="button"
          id="chart-share-notice-close"
          aria-label="閉じる"
        >✕</button>
      </div>

      <!-- モード切り替えボタン -->
      <div id="sensor-test-panel">
        <button id="sensor-start" type="button" aria-pressed="true">
          自動方角
        </button>
        <button id="sensor-stop" type="button" aria-pressed="false">
          手動方角
        </button>
      </div>

      <!-- 文字サイズ切り替え -->
      <div id="chart-text-size-panel">
        <button type="button" id="toggle-object-labels">
          消
        </button>
        <button type="button" data-text-size="small">小</button>
        <button type="button" data-text-size="medium" class="active">中</button>
        <button type="button" data-text-size="large">大</button>
        <button type="button" id="chart-share-button" aria-label="プラネタリウムをコピー" title="プラネタリウムをコピー">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="8" y="8" width="12" height="13" rx="2" />
            <path d="M16 8V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h2" />
          </svg>
        </button>
      </div>

    </section>

    <!-- 観測日時選択フッター -->
    <footer id="datetime-footer">

      <!-- 現在選択されている観測日時 -->
      <div id="datetime-display">
        <span id="datetime-year">1974</span><small class="date-unit">年</small><span
          id="datetime-month">10</span><small>月</small><span id="datetime-day">23</span><small
          class="date-unit">日</small><span id="datetime-hour">00</span><small>時</small><span
          id="datetime-minute">00</span><small>分</small>
      </div>

      <!-- 日時変更ボタン -->
      <div id="datetime-controls">

        <button type="button" id="datetime-prev" class="datetime-arrow" aria-label="戻す">
          ◀
        </button>

        <button type="button" class="datetime-field" data-unit="year">
          年
        </button>

        <button type="button" class="datetime-field" data-unit="month">
          月
        </button>

        <button type="button" class="datetime-field" data-unit="day">
          日
        </button>

        <button type="button" class="datetime-field" data-unit="hour">
          時
        </button>

        <button type="button" class="datetime-field" data-unit="minute">
          分
        </button>

        <button type="button" id="datetime-next" class="datetime-arrow" aria-label="進める">
          ▶
        </button><!-- 現在の空に戻すボタン -->
      </div>

      <button type="button" id="datetime-now" class="datetime-now">
        今<span style="font-size:0.8em;">の</span>日時<span style="font-size:0.8em;">に</span>設定する
      </button>

    </footer>

  </main>
</body>

</html>
